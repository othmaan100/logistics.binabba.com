name: Deploy to FTP Server

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: FTP Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync files to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.binabba.com
          username: othmaan@logistics.binabba.com
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          security: strict
          # Exclude vendor, storage, local environment, tests, and git files
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/storage/**
            **/tests/**
            **/.env
            **/bootstrap/cache/*
