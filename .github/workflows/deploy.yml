name: Deploy to FTP Server via Zip

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Create project archive
        run: |
          mkdir -p deploy
          zip -r deploy/deployment.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "vendor/*" \
            -x "storage/*" \
            -x "tests/*" \
            -x ".env" \
            -x "deploy/*"

      - name: Upload Zip to FTP Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.binabba.com
          username: othmaan@logistics.binabba.com
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: ./deploy/
          server-dir: ./
          timeout: 120000
